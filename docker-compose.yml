# Home AI Agent — compose skeleton.
#
# Service blocks are added incrementally by later tickets, not all at once:
#   caddy              -> M0-03 (Caddy reverse proxy + placeholder frontend) [added]
#   model-runner       -> M1-01 (llama.cpp Vulkan build) [added]
#   agent-server       -> M2-01 (FastAPI + deepagents skeleton) [added]
#   postgres           -> M3-01 (checkpoints + metadata) [added]
#   code-exec-manager  -> M4-03 (sole docker.sock holder, idle reaper)
#
# Fixed topology (see "Reference: Shared Conventions & Contracts" issue, §2):
# only `caddy` publishes a host port (80). Every other service is reachable
# only from inside the `homeai-net` bridge network.

name: homeai

networks:
  homeai-net:
    driver: bridge

volumes:
  pgdata:

services:
  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    ports:
      - "80:80"
    networks:
      - homeai-net
    restart: unless-stopped

  model-runner:
    build: ./services/model-runner
    restart: unless-stopped
    networks: [homeai-net]
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
    ipc: host
    volumes:
      - ./services/model-runner/models:/models:ro
    command: >
      --model /models/${MODEL_FILE}
      --host 0.0.0.0 --port 8080
      --n-gpu-layers 999
      --jinja
      --ctx-size ${MODEL_CTX_SIZE}
      --temp 1.0 --top-p 0.95 --top-k 64
      ${MODEL_EXTRA_ARGS}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s   # model load takes minutes

  agent-server:
    build: ./services/agent-server
    restart: unless-stopped
    networks: [homeai-net]
    user: "${HOMEAI_UID}:${HOMEAI_GID}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR}:/data/workspace
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      EXEC_MANAGER_URL: ${EXEC_MANAGER_URL}
      EXEC_DEFAULT_TIMEOUT_S: ${EXEC_DEFAULT_TIMEOUT_S}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Only used by `tests/test_checkpointer_pg.py` (integration tests) so
      # `docker compose exec agent-server uv run pytest -m integration`
      # "just works" without hand-typing a DSN. Not read by the app itself.
      TEST_PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  postgres:
    image: postgres:17
    restart: unless-stopped
    networks: [homeai-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
