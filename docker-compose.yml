# Home AI Agent — compose skeleton.
#
# Service blocks are added incrementally by later tickets, not all at once:
#   caddy              -> M0-03 (Caddy reverse proxy + placeholder frontend) [added]
#   model-runner       -> M1-01 (llama.cpp Vulkan build) [added]
#   agent-server       -> M2-01 (FastAPI + deepagents skeleton) [added]
#   postgres           -> M3-01 (checkpoints + metadata) [added]
#   code-exec-manager  -> M4-03 (sole docker.sock holder, idle reaper) [added]
#
# Fixed topology (see docs/ARCHITECTURE.md's "Service catalog"): only
# `caddy` publishes a host port (80). M7-01 splits the single bridge that
# used to hold everything into two networks, so "no internet" is the
# default rather than something merely unused:
#   homeai-net      -> the egress-capable network (default Docker NAT, a
#                      route to the internet). Reserved for `caddy` (needs
#                      it to keep the published port) and the M7-02
#                      `egress-proxy` (the sole other service allowed a
#                      route out - see docs/ARCHITECTURE.md §5). No other
#                      service may ever join this network.
#   homeai-internal -> `internal: true` - Docker refuses to attach any
#                      default route/NAT to this network, so no container
#                      on it can reach the public internet at the network
#                      layer, not merely by omission. Every other service
#                      (agent-server, model-runner, code-exec-manager,
#                      postgres, egress-proxy) lives here too, since it's
#                      how those services (once wired up in M7-03/M7-04)
#                      reach `egress-proxy` in the first place.
# `caddy` and `egress-proxy` are the only services on `homeai-net`; `caddy`
# additionally needs `homeai-internal` to reach `agent-server`, and
# `egress-proxy` additionally needs `homeai-internal` to be reachable BY
# `agent-server` (the only realistic future consumer, M7-03/M7-04).

name: homeai

networks:
  homeai-net:
    driver: bridge
  homeai-internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  # mitmproxy's own generated CA (private key + cert), written to
  # ~/.mitmproxy inside the egress-proxy container on its first start - not
  # baked into any image. M7-03/M7-04 mount this SAME volume read-only and
  # trust `mitmproxy-ca-cert.pem` from it (docs/ARCHITECTURE.md §5 has the
  # exact steps).
  egress-proxy-ca:

services:
  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    ports:
      - "80:80"
    # Only service on BOTH networks (see the top-of-file comment): needs
    # homeai-net for the published port, homeai-internal to reach agent-server.
    networks:
      - homeai-net
      - homeai-internal
    restart: unless-stopped

  # M7-02: the single, deliberately-narrow egress chokepoint - the only
  # other service besides `caddy` allowed on `homeai-net`. Terminates TLS
  # with its own locally-generated CA (mounted at `egress-proxy-ca` below)
  # so `policy.py` can see the real method/host/path of HTTPS requests
  # rather than an opaque `CONNECT host:443` tunnel, and enforces the
  # GET/HEAD-only + destination-guard policy documented in
  # docs/ARCHITECTURE.md §5 before anything is forwarded. Not yet wired up
  # as any service's actual `HTTPS_PROXY` (that's M7-03/M7-04) - this
  # ticket only stands the proxy itself up and proves it works via
  # `scripts/verify_egress.sh`.
  egress-proxy:
    build: ./services/egress-proxy
    restart: unless-stopped
    # Both networks: homeai-net for its own route out to the public
    # internet (the entire point of this service), homeai-internal so that
    # agent-server (M7-03/M7-04) can reach it as `http://egress-proxy:8080`.
    networks:
      - homeai-net
      - homeai-internal
    volumes:
      - egress-proxy-ca:/home/mitmproxy/.mitmproxy
    environment:
      EGRESS_MAX_BYTES: ${EGRESS_MAX_BYTES}

  model-runner:
    build: ./services/model-runner
    restart: unless-stopped
    # internal-only (M7-01) - no route to the public internet.
    networks: [homeai-internal]
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
    ipc: host
    volumes:
      - ./services/model-runner/models:/models:ro
    command: >
      --model /models/${MODEL_FILE}
      --host 0.0.0.0 --port 8080
      --n-gpu-layers 999
      --jinja
      --ctx-size ${MODEL_CTX_SIZE}
      --temp 1.0 --top-p 0.95 --top-k 64
      ${MODEL_EXTRA_ARGS}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s   # model load takes minutes

  agent-server:
    build: ./services/agent-server
    restart: unless-stopped
    # internal-only (M7-01) - no route to the public internet. Stage 2's
    # web access (M7-03/M7-04) will go through the M7-02 `egress-proxy` on
    # `homeai-net` (reachable here at `http://egress-proxy:8080` over
    # `homeai-internal`), not by adding this service to `homeai-net` itself.
    networks: [homeai-internal]
    user: "${HOMEAI_UID}:${HOMEAI_GID}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR}:/data/workspace
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      EXEC_MANAGER_URL: ${EXEC_MANAGER_URL}
      EXEC_DEFAULT_TIMEOUT_S: ${EXEC_DEFAULT_TIMEOUT_S}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Only used by `tests/test_checkpointer_pg.py` (integration tests) so
      # `docker compose exec agent-server uv run pytest -m integration`
      # "just works" without hand-typing a DSN. Not read by the app itself.
      TEST_PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  postgres:
    image: postgres:17
    restart: unless-stopped
    # internal-only (M7-01) - no route to the public internet.
    networks: [homeai-internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The *only* service with docker.sock mounted (README.md "Isolation
  # boundary" / "Documented future hardening (not v1)": a docker-socket-proxy
  # fast-follow is intentionally deferred, so this runs as root - no `user:`
  # override, unlike agent-server's own non-root `user:` above). Owns the
  # session-scoped exec container lifecycle (ensure/execute/delete, M4-02)
  # and the idle reaper (M4-03) that stops+removes containers idle past
  # EXEC_IDLE_MINUTES. `scripts/check_socket_exclusivity.sh` enforces that no
  # other service in this file ever gains its own docker.sock mount. Reaches
  # the Docker daemon via the bind-mounted unix socket below, not over the
  # network, so `internal: true` on homeai-internal (M7-01) doesn't affect
  # it - the exec containers it spawns keep their own `network_mode: none`
  # regardless (see docs/ARCHITECTURE.md §5), independent of this network split.
  code-exec-manager:
    build: ./services/code-exec-manager
    restart: unless-stopped
    # internal-only (M7-01) - no route to the public internet.
    networks: [homeai-internal]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WORKSPACE_DIR: ${WORKSPACE_DIR}
      HOMEAI_UID: ${HOMEAI_UID}
      HOMEAI_GID: ${HOMEAI_GID}
      EXEC_IDLE_MINUTES: ${EXEC_IDLE_MINUTES}
      EXEC_DEFAULT_TIMEOUT_S: ${EXEC_DEFAULT_TIMEOUT_S}
