# Home AI Agent — compose skeleton.
#
# Service blocks are added incrementally by later tickets, not all at once:
#   caddy              -> M0-03 (Caddy reverse proxy + placeholder frontend) [added]
#   model-runner       -> M1-01 (llama.cpp Vulkan build) [added]
#   agent-server       -> M2-01 (FastAPI + deepagents skeleton) [added]
#   postgres           -> M3-01 (checkpoints + metadata) [added]
#   code-exec-manager  -> M4-03 (sole docker.sock holder, idle reaper) [added]
#   egress-proxy       -> M7-02 (mitmproxy filtering forward proxy) [added]
#   web-fetch          -> M7-03 (fetch + readable-text extraction, behind egress-proxy) [added]
#   searxng            -> M7-04 (self-hosted metasearch engine, GET-only engines) [added]
#
# Fixed topology (see docs/ARCHITECTURE.md's "Service catalog"): only
# `caddy` publishes host ports (80 and, as of M9-05, 443). M7-01 splits the single bridge that
# used to hold everything into two networks, so "no internet" is the
# default rather than something merely unused:
#   homeai-net      -> the egress-capable network (default Docker NAT, a
#                      route to the internet). Reserved for `caddy` (needs
#                      it to keep the published port) and the M7-02
#                      `egress-proxy` (the sole other service allowed a
#                      route out - see docs/ARCHITECTURE.md §5). No other
#                      service may ever join this network.
#   homeai-internal -> `internal: true` - Docker refuses to attach any
#                      default route/NAT to this network, so no container
#                      on it can reach the public internet at the network
#                      layer, not merely by omission. Every other service
#                      (agent-server, model-runner, code-exec-manager,
#                      postgres, egress-proxy, web-fetch, searxng) lives
#                      here too, since it's how `web-fetch` (M7-03) and
#                      `searxng` (M7-04) both reach `egress-proxy` in the
#                      first place.
# `caddy` and `egress-proxy` are the only services on `homeai-net`; `caddy`
# additionally needs `homeai-internal` to reach `agent-server`, and
# `egress-proxy` additionally needs `homeai-internal` to be reachable BY
# `web-fetch` (M7-03) and `searxng` (M7-04) — `agent-server`'s own
# `web_search`/`web_fetch` tools (M7-05) reach `web-fetch` over this same
# network instead; none of the four ever joins `homeai-net` itself.

name: homeai

networks:
  homeai-net:
    driver: bridge
  homeai-internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  # Caddy's data dir (`/data`) — holds the local CA (`tls internal`) so
  # the root stays stable across container recreates. M9-05.
  caddy-data:
  # mitmproxy's own generated CA (private key + cert), written to
  # ~/.mitmproxy inside the egress-proxy container on its first start - not
  # baked into any image. `web-fetch` (M7-03) and `searxng` (M7-04, both
  # below) each mount this SAME volume read-only and trust
  # `mitmproxy-ca-cert.pem` from it (docs/ARCHITECTURE.md §5 has the exact
  # steps).
  egress-proxy-ca:

services:
  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    # Only service on BOTH networks (see the top-of-file comment): needs
    # homeai-net for the published ports, homeai-internal to reach agent-server.
    networks:
      - homeai-net
      - homeai-internal
    restart: unless-stopped

  # M7-02: the single, deliberately-narrow egress chokepoint - the only
  # other service besides `caddy` allowed on `homeai-net`. Terminates TLS
  # with its own locally-generated CA (mounted at `egress-proxy-ca` below)
  # so `policy.py` can see the real method/host/path of HTTPS requests
  # rather than an opaque `CONNECT host:443` tunnel, and enforces the
  # GET/HEAD-only + destination-guard policy documented in
  # docs/ARCHITECTURE.md §5 before anything is forwarded. First actual
  # consumer is `web-fetch` (M7-03, below); `scripts/verify_egress.sh`
  # exercises the proxy itself directly, independent of any consumer.
  egress-proxy:
    build: ./services/egress-proxy
    restart: unless-stopped
    # Both networks: homeai-net for its own route out to the public
    # internet (the entire point of this service), homeai-internal so that
    # web-fetch (M7-03, below) can reach it as `http://egress-proxy:8080`.
    networks:
      - homeai-net
      - homeai-internal
    volumes:
      - egress-proxy-ca:/home/mitmproxy/.mitmproxy
    environment:
      EGRESS_MAX_BYTES: ${EGRESS_MAX_BYTES}

  # M7-03/M7-04: the only service allowed to talk to `egress-proxy` (spec:
  # "a narrow internal HTTP service is the only thing that talks to the
  # proxy"). `GET /fetch` (M7-03) turns a URL into readable markdown/text
  # with hard caps (`FETCH_MAX_BYTES`/`FETCH_MAX_TEXT_CHARS`); `GET
  # /search` (M7-04, added to this same service per the M7-03 subagent's
  # own contract note, not a new Python service) proxies a query to the
  # internal `searxng` instance below and normalizes its JSON. Either way
  # the agent (once M7-05 wires up a tool) never sees raw HTML/SearXNG
  # response shapes and never itself holds a network handle.
  # `agent-server`'s own `execute_code` tool convention (an
  # internal-service HTTP client, no direct network/Docker access) is the
  # template this follows — see docs/ARCHITECTURE.md §2/§3 for the full
  # API contract.
  web-fetch:
    build: ./services/web-fetch
    restart: unless-stopped
    # internal-only (M7-01) - reaches the public web ONLY via `egress-proxy`
    # over this network, never by joining `homeai-net` itself. Reaches
    # `searxng` (M7-04, below) directly over this same network too -
    # `searxng` itself is the one that goes through `egress-proxy`, not
    # this hop.
    networks: [homeai-internal]
    user: "${HOMEAI_UID}:${HOMEAI_GID}"
    # Read-only: the CA private key (`mitmproxy-ca.pem`) also lives in this
    # volume, but nothing besides `egress-proxy` itself should ever be able
    # to write to it (docs/ARCHITECTURE.md §5, "CA handling" point 1).
    # `entrypoint.sh` combines `mitmproxy-ca-cert.pem` from here with the
    # image's own system CA bundle before `uvicorn` starts.
    volumes:
      - egress-proxy-ca:/ca:ro
    environment:
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL}
      FETCH_TIMEOUT_S: ${FETCH_TIMEOUT_S}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES}
      FETCH_MAX_TEXT_CHARS: ${FETCH_MAX_TEXT_CHARS}
      FETCH_MAX_REDIRECTS: ${FETCH_MAX_REDIRECTS}
      SEARXNG_URL: ${SEARXNG_URL}

  # M7-04: self-hosted metasearch engine - only reachable from `web-fetch`'s
  # `GET /search` above, over `homeai-internal`. NOT routed by Caddy (no
  # `homeai-net` membership, no public-facing UI) - the UI never talks to
  # it, per the ticket spec. `services/searxng/settings.yml`'s own header
  # comment has the full audited GET-only engine list + the reasoning
  # behind every non-default setting; docs/ARCHITECTURE.md §2's "searxng"
  # entry has the service-catalog summary.
  searxng:
    # Pinned by digest (multi-platform manifest-list digest, resolved via
    # the Docker Hub v2 tags API for the `searxng/searxng:latest` tag on
    # 2026-09-04 - same method services/egress-proxy/Dockerfile's own
    # comment used for mitmproxy/mitmproxy:12, since this sandbox has no
    # local docker daemon to run `docker inspect`/`buildx imagetools
    # inspect` against). Re-verify with `docker buildx imagetools inspect
    # searxng/searxng:latest` once this runs somewhere with real
    # registry+docker access.
    image: searxng/searxng@sha256:8bb6a6f677a758cefa4ae2c9f5da1012876e428a4388e3e86f34be4ca715330a
    # was: searxng/searxng:latest (resolved 2026-09-04)
    restart: unless-stopped
    # internal-only (M7-01) - its OWN outbound requests (to the public
    # search engines) go through `egress-proxy` via `outgoing.proxies` in
    # settings.yml, not a direct route out - this service never joins
    # `homeai-net` itself.
    networks: [homeai-internal]
    volumes:
      # Read-only, mounted at the exact path the image's own
      # `container/entrypoint.sh` expects a pre-existing settings.yml
      # (`/etc/searxng/settings.yml`) - see that file's own header comment
      # for why supplying it here skips the image's first-boot
      # random-secret bootstrap path entirely.
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
      # Same named volume `web-fetch` mounts for the same reason (M7-02's
      # "CA handling" recipe, docs/ARCHITECTURE.md §5) - mounted at a
      # separate top-level path (not nested under /etc/searxng) so the
      # entrypoint's own ownership check on its config dir never has to
      # reason about a second, independently-owned mount underneath it.
      - egress-proxy-ca:/etc/searxng-ca:ro
    environment:
      # See settings.yml's own `server.secret_key` comment: wired through
      # for consistency with this repo's env-var-per-secret convention,
      # but the pinned image does NOT currently read this to patch an
      # already-existing settings.yml - flagged there, not hidden.
      SEARXNG_SECRET: ${SEARXNG_SECRET}

  model-runner:
    build: ./services/model-runner
    restart: unless-stopped
    # internal-only (M7-01) - no route to the public internet.
    networks: [homeai-internal]
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
    ipc: host
    volumes:
      - ./services/model-runner/models:/models:ro
    command: >
      --model /models/${MODEL_FILE}
      --host 0.0.0.0 --port 8080
      --n-gpu-layers 999
      --jinja
      --ctx-size ${MODEL_CTX_SIZE}
      --temp 1.0 --top-p 0.95 --top-k 64
      ${MODEL_EXTRA_ARGS}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s   # model load takes minutes

  agent-server:
    build: ./services/agent-server
    restart: unless-stopped
    # internal-only (M7-01) - no route to the public internet. Stage 2's
    # web access goes through `web-fetch` (M7-03, above) via the
    # `web_search`/`web_fetch` tools (M7-05, `WEB_FETCH_URL` below) —
    # `web-fetch` is the only thing that talks to `egress-proxy` directly;
    # agent-server never gets its own `HTTPS_PROXY`/CA-trust setup.
    networks: [homeai-internal]
    user: "${HOMEAI_UID}:${HOMEAI_GID}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR}:/data/workspace
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      EXEC_MANAGER_URL: ${EXEC_MANAGER_URL}
      EXEC_DEFAULT_TIMEOUT_S: ${EXEC_DEFAULT_TIMEOUT_S}
      WEB_FETCH_URL: ${WEB_FETCH_URL}
      WEB_FETCH_TOOL_MAX_CHARS: ${WEB_FETCH_TOOL_MAX_CHARS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Only used by `tests/test_checkpointer_pg.py` (integration tests) so
      # `docker compose exec agent-server uv run pytest -m integration`
      # "just works" without hand-typing a DSN. Not read by the app itself.
      TEST_PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  postgres:
    image: postgres:17
    restart: unless-stopped
    # internal-only (M7-01) - no route to the public internet.
    networks: [homeai-internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The *only* service with docker.sock mounted (README.md "Isolation
  # boundary" / "Documented future hardening (not v1)": a docker-socket-proxy
  # fast-follow is intentionally deferred, so this runs as root - no `user:`
  # override, unlike agent-server's own non-root `user:` above). Owns the
  # session-scoped exec container lifecycle (ensure/execute/delete, M4-02)
  # and the idle reaper (M4-03) that stops+removes containers idle past
  # EXEC_IDLE_MINUTES. `scripts/check_socket_exclusivity.sh` enforces that no
  # other service in this file ever gains its own docker.sock mount. Reaches
  # the Docker daemon via the bind-mounted unix socket below, not over the
  # network, so `internal: true` on homeai-internal (M7-01) doesn't affect
  # it - the exec containers it spawns keep their own `network_mode: none`
  # regardless (see docs/ARCHITECTURE.md §5), independent of this network split.
  code-exec-manager:
    build: ./services/code-exec-manager
    restart: unless-stopped
    # internal-only (M7-01) - no route to the public internet.
    networks: [homeai-internal]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WORKSPACE_DIR: ${WORKSPACE_DIR}
      HOMEAI_UID: ${HOMEAI_UID}
      HOMEAI_GID: ${HOMEAI_GID}
      EXEC_IDLE_MINUTES: ${EXEC_IDLE_MINUTES}
      EXEC_DEFAULT_TIMEOUT_S: ${EXEC_DEFAULT_TIMEOUT_S}
